version: '3.9'

services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute-test
    ports:
      - "20128:20128"
    environment:
      # Optional: Add environment variables
      # NODE_ENV: production
      # LOG_LEVEL: info
    volumes:
      # Optional: Persist configuration
      # - ./omniroute-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20128/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for caching (if enabled)
  # redis:
  #   image: redis:7-alpine
  #   container_name: omniroute-redis
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped

networks:
  default:
    name: omniroute-network
