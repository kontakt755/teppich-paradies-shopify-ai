name: Grosshandel-Sync (Dry-Run, manuell)

on:
  # Der Nachtlauf ist ausgesetzt: das Repository-Secret SHOPIFY_ADMIN_TOKEN ist
  # ein atkn_-Token, die Admin GraphQL API braucht shpat_. Der Job scheiterte
  # deshalb jede Nacht am selben Punkt (graphql-proxy.mjs) und erzeugte nur
  # Rauschen. Zeitplan wieder einschalten, sobald ein manueller Lauf mit den
  # Secrets SHOPIFY_CLIENT_ID/SHOPIFY_CLIENT_SECRET gruen ist (#465).
  #  schedule:
  #    - cron: '0 2 * * *'
  # Manuell triggern
  workflow_dispatch:
    inputs:
      approve_sync:
        description: 'Approve live sync (nur für Notfälle!)'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    name: Grosshandel → Shopify Sync
    runs-on: ubuntu-latest
    env:
      # Secrets sind in einem Schritt-if nicht lesbar, nur ueber Job-env.
      HAT_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID != '' }}

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install deps
        run: npm ci

      - name: 🔍 Run Guards
        run: |
          npm run syncpath:guard
          npm run theme:guard

      # Dev-Dashboard-App: client_credentials liefert einen shpat_-Token fuer 24 h,
      # deshalb wird er in jedem Lauf frisch geholt statt als Secret abgelegt.
      # Ohne SHOPIFY_CLIENT_ID bleibt es beim Secret SHOPIFY_ADMIN_TOKEN.
      - name: 🔑 Admin-Token holen (client_credentials)
        if: ${{ env.HAT_CLIENT_ID == 'true' }}
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node scripts/shopify-oauth.mjs --grant client-credentials --github-env

      - name: 📡 Grosshandel-Sync (Dry-Run)
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ env.SHOPIFY_ADMIN_TOKEN || secrets.SHOPIFY_ADMIN_TOKEN }}
          SYNC_APPROVED: ${{ github.event.inputs.approve_sync == 'true' && 'true' || 'false' }}
        run: |
          node workflow/sync-grosshandel.mjs

      - name: 📋 Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-reports
          path: .sync-reports/
          retention-days: 30

