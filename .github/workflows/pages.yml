name: Pages (Control Center)

# Veroeffentlicht docs/ auf GitHub Pages - nur, wenn sich dort etwas geaendert hat.
# Bis 2026-11-07 baute GitHub die Seite selbst nach jedem Push auf main (27 Laeufe
# in 22 h, 15 davon abgebrochen, 22 Maschinenminuten), auch bei reinen Theme-
# oder Skript-Commits. Quelle in den Repository-Einstellungen: "GitHub Actions"
# (build_type "workflow"); docs/.nojekyll bleibt, es wird nichts umgewandelt.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Solange die Pages-Quelle in den Einstellungen noch "Deploy from a branch"
      # ist (Umstellen kann nur der Inhaber, Werkbank w-316), baut GitHub weiter
      # selbst; deploy-pages wuerde dann rot abbrechen. Deshalb vorher nachsehen
      # und still aussteigen statt ein rotes Kreuz an main zu haengen.
      - id: quelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          art=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unbekannt)
          echo "build_type=$art" >> "$GITHUB_OUTPUT"
          [ "$art" = "workflow" ] || echo "Pages-Quelle ist '$art', nicht 'workflow' - GitHub baut selbst, hier nichts zu tun."
      - if: steps.quelle.outputs.build_type == 'workflow'
        uses: actions/checkout@v7
      - if: steps.quelle.outputs.build_type == 'workflow'
        uses: actions/configure-pages@v5
      - if: steps.quelle.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - if: steps.quelle.outputs.build_type == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v4
