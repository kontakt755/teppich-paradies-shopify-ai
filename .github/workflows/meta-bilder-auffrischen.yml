name: Meta-Katalog Bilder neu abrufen

# Nur manuell. Speichert jedes aktive Produkt im Kanal Facebook & Instagram einmal
# neu (Tag setzen und sofort entfernen), damit Meta nicht geladene Bilder erneut
# holt. Siehe operations/scripts/meta-bilder-auffrischen.mjs.
on:
  workflow_dispatch:
    inputs:
      pause:
        description: Pause je Produkt in ms
        default: '3000'
      limit:
        description: Hoechstens so viele Produkte (leer = alle)
        default: ''
      medien:
        description: Variantenbilder ab- und wieder anhaengen statt nur neu speichern
        type: boolean
        default: false
      abfrage:
        description: Zusaetzliche Produktsuche, z. B. (vendor:Vorwerk OR vendor:JAB*)
        default: ''

permissions:
  contents: read

concurrency:
  group: meta-bilder-auffrischen
  cancel-in-progress: false

jobs:
  auffrischen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HAT_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Admin-Token holen (client_credentials)
        if: ${{ env.HAT_CLIENT_ID == 'true' }}
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node scripts/shopify-oauth.mjs --grant client-credentials --github-env

      - name: Produkte neu speichern
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ env.SHOPIFY_ADMIN_TOKEN || secrets.SHOPIFY_ADMIN_TOKEN }}
          PAUSE: ${{ inputs.pause }}
          LIMIT: ${{ inputs.limit }}
          MEDIEN: ${{ inputs.medien }}
          ABFRAGE: ${{ inputs.abfrage }}
        run: |
          set -- --pause "$PAUSE"
          [ -n "$LIMIT" ] && set -- "$@" --limit "$LIMIT"
          [ "$MEDIEN" = "true" ] && set -- "$@" --medien
          [ -n "$ABFRAGE" ] && set -- "$@" --abfrage "$ABFRAGE"
          node operations/scripts/meta-bilder-auffrischen.mjs "$@"
