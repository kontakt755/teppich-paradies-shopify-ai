name: JordanShop Sync (Daily Dry-Run)

on:
  # Tägliche Dry-Runs um 2 Uhr morgens
  schedule:
    - cron: '0 2 * * *'
  # Manuell triggern
  workflow_dispatch:
    inputs:
      approve_sync:
        description: 'Approve live sync (nur für Notfälle!)'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    name: JordanShop → Shopify Sync
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install deps
        run: npm ci

      - name: 🔐 Store Shopify Token
        run: |
          mkdir -p ~/.shopify
          echo "${{ secrets.SHOPIFY_ADMIN_TOKEN }}" > ~/.shopify/token
          chmod 600 ~/.shopify/token

      - name: 🔍 Run Guards
        run: |
          npm run syncpath:guard
          npm run theme:guard

      - name: 📡 JordanShop Sync (Dry-Run)
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SYNC_APPROVED: ${{ github.event.inputs.approve_sync == 'true' && 'true' || 'false' }}
        run: |
          node workflow/sync-jordanshop.mjs

      - name: 📋 Upload Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: sync-reports
          path: .sync-reports/
          retention-days: 30

      - name: 💬 Notify on Slack (Optional)
        if: always() && secrets.SLACK_WEBHOOK
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "JordanShop Sync Report",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "📊 *JordanShop Sync*\n*Status:* ${{ job.status }}\n*Approved:* ${{ github.event.inputs.approve_sync == 'true' && '✅' || '❌' }}"
                  }
                }
              ]
            }
