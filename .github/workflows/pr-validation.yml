name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  safe-static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run qa:unit:test
      - run: npm run automation:test
      - run: npm run workflow:test
      - run: npm run qa:evidence:test
      - run: npm run secret:scan

  local-verification-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Full history (not the default shallow depth-1 checkout) is required:
      # the gate diffs the evidence file's recorded commit against the PR
      # head to confirm no other file changed since, and that commit is not
      # necessarily the tip of the fetched history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node workflow/verify-local-checks.mjs
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
