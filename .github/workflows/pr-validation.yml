name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  safe-static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python3 -m py_compile router_api_migration.py api_cost_monitor.py demo_run.py tests/test_api_router.py
      - run: python3 -m unittest tests/test_api_router.py
      - run: npm run qa:unit:test
      - run: npm run automation:test
      - run: npm run workflow:test
      - run: npm run qa:evidence:test
      - run: npm run secret:scan
      # Beide Guards liefen bisher nur in `workflow:validate`, also nur wenn
      # jemand sie lokal aufrief. Genau die Fehler, die sie abfangen, sind
      # mehrfach ueber PRs bis in main gelangt: ungueltiges Liquid, das Shopify
      # beim Push still verwirft, und Block-Schemata, die zwar deployen, aber
      # im Theme-Editor unsichtbar bleiben.
      - run: npm run liquid:guard
      - run: npm run schema:guard
