name: Feed Teppich nach Mass (Beispiel-Endpreise)

# Taeglich validierte Beispiel-Endpreise aus Shopify und der Produktseite erzeugen.
# Beide bisherigen Dateien gemeinsam auf den Zweig feed-daten legen.
# legen. Das Merchant Center ruft die Datei als ergaenzende Quelle per Link ab
# (raw.githubusercontent.com/.../feed-daten/tp-tnm-preise.txt), siehe #1283.
# Daneben tp-tnm-meta.tsv: vollstaendiger Feed fuer den eigenen Meta-Katalog
# "Teppich nach Mass (Feed)", alle bisherigen Pflicht- und Zuordnungsfelder bleiben.
# Ein Commit ersetzt beide Quellen samt Pruefmanifest. Fehler verhindern den Commit.
# MC-Regeln/Quellabruf und Flow-Zulassung werden separat koordiniert, siehe
# domains/shopify/google-feed-flaechenware.md. Kein automatisches Kanal-Publish hier.
# Bewusst nicht nach main: ein taeglicher Commit dort wuerde Deploy-Fenster stoeren.
on:
  schedule:
    # 04:15 UTC, vor dem Abruf durch das Merchant Center (taeglich 07:00 Berlin)
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-tnm-preise
  cancel-in-progress: false

jobs:
  preise:
    runs-on: ubuntu-latest
    env:
      HAT_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID != '' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Admin-Token holen (client_credentials)
        if: ${{ env.HAT_CLIENT_ID == 'true' }}
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node scripts/shopify-oauth.mjs --grant client-credentials --github-env

      - name: Bisherige Datei vom Zweig feed-daten holen
        run: |
          git fetch --depth=1 origin feed-daten
          git show origin/feed-daten:tp-tnm-preise.txt > vorher.txt
          git show origin/feed-daten:tp-tnm-meta.tsv > vorher-meta.tsv

      - name: Preise erzeugen
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ env.SHOPIFY_ADMIN_TOKEN || secrets.SHOPIFY_ADMIN_TOKEN }}
        run: node operations/scripts/feed-tnm-abruf.mjs --aus tp-tnm-preise.txt --vorher vorher.txt --meta-aus tp-tnm-meta.tsv --meta-vorher vorher-meta.tsv --pruefung tp-tnm-pruefung.json

      - name: Auf feed-daten veroeffentlichen
        run: |
          mkdir veroeffentlichung && cd veroeffentlichung
          git init -q -b feed-daten
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin feed-daten; then git checkout -q -B feed-daten FETCH_HEAD; fi
          cp ../tp-tnm-preise.txt ../tp-tnm-meta.tsv ../tp-tnm-pruefung.json .
          git add tp-tnm-preise.txt tp-tnm-meta.tsv tp-tnm-pruefung.json
          if git diff --cached --quiet; then echo "keine Preisaenderung"; exit 0; fi
          git commit -q -m "Teppich-nach-Mass-Beispiel-Endpreise $(date -u +%F)"
          git push -q origin feed-daten
