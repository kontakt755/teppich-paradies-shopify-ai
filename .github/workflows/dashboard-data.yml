name: dashboard-data

# Haelt die beiden erzeugten Dateien des Control Centers aktuell:
#
#   docs/ai-dashboard/issues.json      - Aufgabenstand aus GitHub Issues
#   docs/ai-dashboard/bodenwissen.json - Redaktionsstand aus content/
#
# Das Dashboard liest nur diese Dateien, damit der Browser keinen GitHub-Token
# braucht. issues.json holt ihre Daten ueber die GitHub-API (GH_TOKEN),
# bodenwissen.json ausschliesslich aus dem Repository selbst - kein Token,
# kein Netz.
#
# Das Control Center laeuft seit 2026-09-23 nur noch lokal (Inhaberentscheidung,
# siehe docs/control-center/ARCHITEKTUR.md Abschnitt 1b) - keine oeffentliche
# Anzeige mehr. Beide Dateien werden trotzdem hier erzeugt: sie sind die
# Datenquelle fuer den lokalen Server (scripts/serve-dashboard.mjs) und werden
# von app.js nur noch angezeigt, wenn /api/capabilities einen lokalen Server
# meldet. Dieser Workflow veroeffentlicht damit keine Aufgabendaten oeffentlich,
# er haelt nur die Dateien auf main aktuell.
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  schedule:
    # Alle 30 Minuten als Sicherheitsnetz. Die eigentliche Aktualisierung laeuft
    # ueber die issues-Events oben (sofort). Ein 10-Minuten-Cron wuerde bei
    # einem privaten Repo das Free-Kontingent von 2000 Actions-Minuten/Monat
    # sprengen (~2160 Min); alle 30 Minuten braucht ca. 600 Min und bleibt darunter.
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-dashboard-data.mjs'
      - '.github/workflows/dashboard-data.yml'
      # Quellen von bodenwissen.json. Ohne diese Pfade veraltet die Datei
      # still, sobald jemand Inhalte aendert - die Issue-Events oben loesen
      # bei einem reinen Content-Commit nichts aus.
      - 'content/ratgeber/**'
      - 'content/lexikon/**'
      - 'content/probleme/**'
      - 'scripts/build-bodenwissen-data.mjs'
      # Die Redaktionslogik (STATUS, pruefe) kommt importiert aus dem Gate.
      # Aendert sie sich, aendert sich auch der Inhalt von bodenwissen.json.
      - 'scripts/bodenwissen-guard.mjs'

concurrency:
  group: dashboard-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: issues.json erzeugen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_REPO: ${{ github.repository }}
        run: node scripts/build-dashboard-data.mjs

      # Bewusst ohne GH_TOKEN: die Daten kommen aus content/ im Repository.
      - name: bodenwissen.json erzeugen
        run: node scripts/build-bodenwissen-data.mjs

      - name: Committen wenn geaendert
        env:
          # Beide Dateien gehoeren dem Bot und werden einzeln gestagt - nie
          # "git add -A" und nie der ganze Ordner: eine unveraenderte Datei
          # gehoert nicht in den Commit (CLAUDE.md, Abschnitt Dashboard).
          DATEIEN: 'docs/ai-dashboard/issues.json docs/ai-dashboard/bodenwissen.json'
        run: |
          set -euo pipefail

          geaendert=()
          for datei in $DATEIEN; do
            if git diff --quiet -- "$datei"; then
              echo "Keine Aenderung an $datei"
            else
              geaendert+=("$datei")
            fi
          done

          if [ ${#geaendert[@]} -eq 0 ]; then
            echo "Nichts zu committen"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${geaendert[@]}"
          git commit -m "chore(dashboard): Dashboard-Daten aktualisieren [skip ci]"

          # Zwischen checkout und push kann ein anderer Commit auf main
          # gelandet sein (paralleler Lauf oder lokaler Push). Dann wird der
          # Push abgelehnt - also rebasen und erneut versuchen. Beide Dateien
          # sind erzeugt: bei einem Konflikt soll die Fassung gewinnen, die
          # dieser Lauf gerade erzeugt hat - sie ist die juengere.
          for versuch in 1 2 3 4 5; do
            if git push; then
              echo "Push erfolgreich (Versuch $versuch)"
              exit 0
            fi
            echo "Push abgelehnt, rebase und neuer Versuch ($versuch/5)"
            git fetch origin main
            if ! git rebase origin/main; then
              # Nur die eigenen Bot-Dateien aufloesen. Ein Konflikt in einer
              # anderen Datei bleibt stehen, "rebase --continue" scheitert
              # dann und der Lauf bricht kontrolliert ab - statt fremde
              # Aenderungen blind zu ueberschreiben.
              #
              # --theirs, nicht --ours: waehrend eines Rebase ist "ours" der
              # Upstream (origin/main), auf den wiedergespielt wird, und
              # "theirs" der eigene Commit, der gerade wiedergespielt wird.
              # Die Benennung ist genau umgekehrt zum Merge. Mit --ours stand
              # hier die AELTERE Fassung vom Server, die frisch erzeugte war
              # weg (belegt mit dem Szenario aus docs/lessons/
              # rebase-ours-ist-der-upstream.md).
              for datei in $(git diff --name-only --diff-filter=U); do
                case " $DATEIEN " in
                  *" $datei "*)
                    git checkout --theirs -- "$datei"
                    git add -- "$datei"
                    ;;
                esac
              done
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep $((versuch * 3))
          done

          echo "::error::Push nach 5 Versuchen fehlgeschlagen"
          exit 1
