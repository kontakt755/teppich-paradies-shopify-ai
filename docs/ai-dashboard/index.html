<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teppich Dashboard</title>
  <!-- Als App installierbar (Edge/Chrome, Safari "Zum Dock hinzufuegen", iOS/Android
       "Zum Home-Bildschirm"). Bewusst OHNE Service Worker: der wuerde issues.json
       cachen und veraltete Staende anzeigen. -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#1f2937">
  <meta name="description" content="Control Center: Aufgaben, Freigaben, Blocker und naechste Schritte fuer Teppich Paradies">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Teppich Dashboard">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>
  <header class="topbar" role="banner">
    <div class="topbar-inner">
      <a class="brand" href="#/heute" aria-label="Teppich Paradies Control Center">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Teppich Paradies<small>Control Center</small></span>
      </a>
      <nav class="mainnav" id="mainnav" aria-label="Hauptnavigation">
        <a href="#/heute" data-nav="heute">Heute</a>
        <a href="#/arbeit" data-nav="arbeit">Arbeit</a>
        <a href="#/freigaben" data-nav="freigaben">Freigaben<span class="nav-count" id="navFreigaben" hidden></span></a>
        <a href="#/bereiche" data-nav="bereiche">Bereiche</a>
        <a href="#/insights" data-nav="insights">Insights</a>
        <a href="#/aktivitaet" data-nav="aktivitaet">Aktivität</a>
      </nav>
      <div class="topbar-tools">
        <button type="button" class="btn btn-ghost" id="searchBtn" title="Suche und Befehle (⌘K)">
          <span aria-hidden="true">⌕</span> Suche <kbd>⌘K</kbd>
        </button>
        <button type="button" class="sync-chip" id="syncChip" title="Datenstand und Synchronisation">
          <span class="dot" aria-hidden="true"></span><span id="syncChipText">Lade …</span>
        </button>
        <button type="button" class="btn btn-ghost nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mainnav" aria-label="Navigation öffnen">☰</button>
      </div>
    </div>
  </header>

  <main id="main" class="page" tabindex="-1" aria-live="polite">
    <section class="skeleton" aria-busy="true">
      <div class="sk-line w40"></div>
      <div class="sk-band"></div>
      <div class="sk-card"></div>
      <div class="sk-card"></div>
    </section>
  </main>

  <!-- Aufgaben-Detail als Sheet mit Deep Link (#/…?task=92) -->
  <div id="sheetRoot"></div>
  <!-- Command Palette -->
  <div id="paletteRoot"></div>
  <!-- Dialoge (Statuswechsel, Freigabe) -->
  <div id="dialogRoot"></div>
  <div id="toastRoot" class="toasts" aria-live="assertive"></div>

  <noscript>Für das Control Center muss JavaScript aktiviert sein.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
