version: 1
default_unknown_risk: MEDIUM
production_unknown_risk: HIGH
precedence:
  - LOW
  - MEDIUM
  - HIGH

global:
  data:
    secrets: HIGH
    credentials: HIGH
    personal_customer_data: HIGH
    payment_data: HIGH
    live_price_or_inventory: HIGH
    unpublished_draft_without_final_price: MEDIUM
    public_content: LOW
  operations:
