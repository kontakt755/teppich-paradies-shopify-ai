    report_write: LOW
    isolated_code_edit: LOW
    multi_file_feature_edit: MEDIUM
    create_reversible_draft: MEDIUM
    external_write: HIGH
    delete: HIGH
    publish_or_deploy: HIGH
    purchase_or_order: HIGH
  blast_radius:
    files_over_task_budget: MEDIUM
    bulk_records_over_domain_threshold: HIGH
